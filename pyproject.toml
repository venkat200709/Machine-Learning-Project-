[project]
name = "riskradar"
version = "2.1.0"
description = "Explainable machine learning for women's safety in urban areas."
authors = [{ name = "Venkatesan" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
riskradar = "riskradar.api:app"

[tool.setuptools.packages.find]
where = ["src"]

# ══════════════════════════════════════════════════════════════════════
# Ruff
# ══════════════════════════════════════════════════════════════════════
# A lint config is only useful if a clean run means something. The rules
# disabled below are disabled because they are *wrong for this codebase*, and
# each one says why — not because they were noisy.

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = ["legacy", "notebooks", "docs", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "PERF",      # performance
    "S",         # bandit security
    "BLE",       # blind except
    "PIE",
]

ignore = [
    # FastAPI's entire dependency-injection API is expressed as function calls
    # in argument defaults — `Depends(...)`, `Query(...)`, `File(...)`. This
    # rule fires on every route in the file and cannot be satisfied without
    # abandoning the framework's idiom.
    "B008",

    # The serving layer is built to degrade rather than crash: a failing
    # metrics backend, drift monitor or audit write must never take down a
    # safety service. Those handlers are broad *on purpose* and are each
    # annotated with why. Enforcing narrow excepts here would trade a real
    # availability property for a stylistic one.
    "BLE001", "S110",

    # try/except/continue around best-effort telemetry, same rationale.
    "S112",

    # Files carry no shebang because they are imported, not executed; the
    # executable bit comes from the Windows filesystem the project lives on.
    "EXE002",

    # `assert` is the entire vocabulary of the test suite.
    "S101",

    # Long lines are already capped at 100; the remaining hits are URLs and
    # tabular data in docstrings where wrapping hurts readability.
    "E501",

    # Randomness here is seeded reproducibility (numpy Generator with a fixed
    # seed), never cryptographic. Real secrets use `secrets.token_urlsafe`.
    "S311",

    # The docs use real typography deliberately — en/em dashes, → for
    # transformations, σ for standard deviations, ↔ for Low↔High confusions,
    # ₹ for the budget figures. These are technical notation, not homoglyph
    # smuggling, and rewriting them as ASCII would make the maths harder to
    # read for no security benefit.
    "RUF001", "RUF002", "RUF003",

    # Per-item try/except inside a loop is the point: one malformed row, one
    # unreadable feature or one failed subsystem must not abort the batch.
    "PERF203",

    # `--host 0.0.0.0` is the correct default *inside a container*, where
    # binding to loopback would make the service unreachable from the host.
    # The launcher defaults to 127.0.0.1; this is the opt-in path.
    "S104",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers deliberately to assert internal invariants —
# for example that the calibration score and the serving score are one function.
"tests/*" = ["SLF001", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["riskradar"]

# ══════════════════════════════════════════════════════════════════════
# pytest
# ══════════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::UserWarning",
    # The shipped artefact is a pickle; loading it under a different
    # scikit-learn minor emits this on every single estimator in the pipeline
    # and drowns the actual test output. `run.py` detects a genuine load
    # failure and retrains, so the warning is noise rather than signal.
    "ignore:Trying to unpickle estimator:UserWarning",
]
